# Relyper Backup – Docker Compose deployment with application-aware backup
# (Docker discovery, database dumps, coverage and restore tests).
#
#   docker compose -f docker-compose.apps.yml up -d --build
#   open http://<host>:9898, create the admin user, then open "Infrastructure"
#
# Relyper Backup never sees the Docker socket. It talks to the Relyper Docker
# guard, a small separate container that allows reading the Docker host, the
# fixed database dump scripts and isolated restore-test containers, and
# refuses everything else (no arbitrary commands, no privileged containers,
# no host mounts). Read "Application-aware backup" in DEPLOYMENT.md.
#
# Set a random token first, e.g. in a .env file next to this file:
#   echo "RELYPER_GUARD_TOKEN=$(openssl rand -hex 32)" > .env

services:
  relyper-backup:
    build: .
    image: relyper-backup:latest
    container_name: relyper-backup
    # restic records the hostname in every snapshot; keep it stable. It also
    # tells Relyper Backup which container is its own (not listed as an app).
    hostname: relyper-backup
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      - docker-guard
    ports:
      - "9898:9898"
    # Hardening: read-only image, only the capabilities restic needs to read
    # every file (DAC_READ_SEARCH) and to restore owners and permissions
    # (CHOWN, DAC_OVERRIDE, FOWNER, FSETID). No privileged mode.
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, FSETID]
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Berlin
      # Hook commands: only the database dump command of app plans may run.
      # Remove this line (or set "all") to allow your own shell hooks; then
      # everyone who can edit a plan can run commands in this container.
      RELYPER_HOOK_COMMANDS: dbdump
      RELYPER_GUARD_URL: tcp://docker-guard:2375
      RELYPER_GUARD_TOKEN: ${RELYPER_GUARD_TOKEN:?set RELYPER_GUARD_TOKEN, see the top of this file}
      # Host paths that are mounted at a different path inside this
      # container, as host=container pairs separated by commas.
      RELYPER_HOST_PATH_MAP: /srv=/sources/srv
      # Optional: notifications when protection gets worse or a test fails
      # (shoutrrr URLs, separated by spaces), e.g. ntfy, Telegram, e-mail.
      # RELYPER_NOTIFY_URLS: "ntfy://ntfy.sh/my-backup-topic"
      # RELYPER_PUBLIC_URL: https://backup.example.com
    volumes:
      - relyper-config:/config
      - relyper-data:/data # also holds the database dumps (/data/relyper/dumps)
      - relyper-cache:/cache
      - ./restore:/restore
      # Docker volumes at their real host path, read-only, so plans can
      # name the same paths that Docker reports.
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      # Bind-mounted app data under /srv (see RELYPER_HOST_PATH_MAP).
      - /srv:/sources/srv:ro
      # Easypanel only: project data at its real host path, read-only.
      # - /etc/easypanel/projects:/etc/easypanel/projects:ro
    networks:
      - default
      - docker-api

  docker-guard:
    build:
      context: .
      dockerfile: Dockerfile.docker-guard
    image: relyper-docker-guard:latest
    restart: unless-stopped
    environment:
      RELYPER_GUARD_TOKEN: ${RELYPER_GUARD_TOKEN:?set RELYPER_GUARD_TOKEN, see the top of this file}
      # Each write feature is off unless enabled here. Without them the
      # guard only allows reading (discovery, coverage).
      RELYPER_GUARD_DUMPS: "1" # fixed dump scripts in database containers
      RELYPER_GUARD_VERIFY: "1" # isolated restore-test containers
      # RELYPER_GUARD_LIFECYCLE: "1" # stop/restart containers (MCP, after approval)
      # RELYPER_GUARD_REQUIRE_LABEL: "1" # only containers labelled relyper.dump=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - docker-api

networks:
  # Internal network: only Relyper Backup can reach the guard.
  docker-api:
    internal: true

volumes:
  relyper-config:
  relyper-data:
  relyper-cache:
